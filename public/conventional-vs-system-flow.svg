<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Conventional Operations vs Libang Libu System Workflow</title>
  <desc id="desc">Eight-stage comparison showing how conventional school trip operations are supported and automated by the Libang Libu system.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#572e7e" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M1 1L10 5.5L1 10Z" fill="#ce307d"/>
    </marker>
    <style>
      .main-title{font-family:Arial,sans-serif;font-size:46px;font-weight:800;fill:#572e7e}
      .subtitle{font-family:Arial,sans-serif;font-size:20px;fill:#75687c}
      .column{font-family:Arial,sans-serif;font-size:15px;font-weight:800;letter-spacing:1.6px}
      .phase{font-family:Arial,sans-serif;font-size:15px;font-weight:800;letter-spacing:1px;fill:#ce307d}
      .row-title{font-family:Arial,sans-serif;font-size:22px;font-weight:800;fill:#572e7e}
      .copy{font-family:Arial,sans-serif;font-size:17px;fill:#65596c}
      .num{font-family:Arial,sans-serif;font-size:17px;font-weight:800;text-anchor:middle;dominant-baseline:middle}
      .arrow-line{stroke:#ce307d;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow)}
      .status{font-family:Arial,sans-serif;font-size:14px;font-weight:800;text-anchor:middle;dominant-baseline:middle}
      .foot{font-family:Arial,sans-serif;font-size:17px;font-weight:600;fill:#75687c}
    </style>
  </defs>

  <!-- No full-canvas rectangle: SVG background remains transparent. -->
  <text class="main-title" x="70" y="66">Conventional Operations vs Libang Libu System</text>
  <text class="subtitle" x="70" y="103">How manual school-trip operations become one connected workflow</text>

  <rect x="70" y="130" width="500" height="48" rx="14" fill="#f4eff7"/>
  <text class="column" x="95" y="160" fill="#572e7e">CONVENTIONAL / MANUAL</text>
  <rect x="700" y="130" width="900" height="48" rx="14" fill="#f9e7f0"/>
  <text class="column" x="725" y="160" fill="#ce307d">WHAT THE SYSTEM CATERED</text>
  <rect x="1640" y="130" width="210" height="48" rx="14" fill="#edf6fb"/>
  <text class="column" x="1745" y="160" fill="#4898d1" text-anchor="middle">READINESS</text>

  <!-- Row 1 -->
  <g filter="url(#shadow)">
    <rect x="70" y="194" width="500" height="88" rx="20" fill="#ffffff" stroke="#e8dfea" stroke-width="2"/>
    <rect x="700" y="194" width="900" height="88" rx="20" fill="#ffffff" stroke="#ce307d" stroke-width="2"/>
  </g>
  <circle cx="105" cy="238" r="20" fill="#ce307d"/><text class="num" x="105" y="239" fill="#ffffff">1</text>
  <text class="phase" x="140" y="226">ENQUIRY &amp; BRIEF</text>
  <text class="copy" x="140" y="255">Calls, chats and repeated questions</text>
  <line class="arrow-line" x1="598" y1="238" x2="660" y2="238"/>
  <text class="row-title" x="730" y="228">Structured planning quiz</text>
  <text class="copy" x="730" y="257">Captures school, cohort, learning goals, logistics and budget</text>
  <rect x="1660" y="216" width="170" height="44" rx="22" fill="#e8f6ee"/><text class="status" x="1745" y="239" fill="#187047">READY</text>

  <!-- Row 2 -->
  <g filter="url(#shadow)">
    <rect x="70" y="294" width="500" height="88" rx="20" fill="#ffffff" stroke="#e8dfea" stroke-width="2"/>
    <rect x="700" y="294" width="900" height="88" rx="20" fill="#ffffff" stroke="#ce307d" stroke-width="2"/>
  </g>
  <circle cx="105" cy="338" r="20" fill="#ce307d"/><text class="num" x="105" y="339" fill="#ffffff">2</text>
  <text class="phase" x="140" y="326">ITINERARY &amp; QUOTATION</text>
  <text class="copy" x="140" y="355">Manual research, spreadsheet and costing</text>
  <line class="arrow-line" x1="598" y1="338" x2="660" y2="338"/>
  <text class="row-title" x="730" y="328">AI-ready proposal workflow</text>
  <text class="copy" x="730" y="357">Structured brief, itinerary output and branded quotation email</text>
  <rect x="1660" y="316" width="170" height="44" rx="22" fill="#fff4ce"/><text class="status" x="1745" y="339" fill="#765b0a">AI PENDING</text>

  <!-- Row 3 -->
  <g filter="url(#shadow)">
    <rect x="70" y="394" width="500" height="88" rx="20" fill="#ffffff" stroke="#e8dfea" stroke-width="2"/>
    <rect x="700" y="394" width="900" height="88" rx="20" fill="#ffffff" stroke="#eec445" stroke-width="2"/>
  </g>
  <circle cx="105" cy="438" r="20" fill="#eec445"/><text class="num" x="105" y="439" fill="#572e7e">3</text>
  <text class="phase" x="140" y="426">MEETING &amp; REVISION</text>
  <text class="copy" x="140" y="455">WhatsApp coordination and manual follow-up</text>
  <line class="arrow-line" x1="598" y1="438" x2="660" y2="438"/>
  <text class="row-title" x="730" y="428">Connected client review</text>
  <text class="copy" x="730" y="457">Email / WhatsApp CTA, FAQ and optional second meeting</text>
  <rect x="1660" y="416" width="170" height="44" rx="22" fill="#fff4ce"/><text class="status" x="1745" y="439" fill="#765b0a">PARTIAL</text>

  <!-- Row 4 -->
  <g filter="url(#shadow)">
    <rect x="70" y="494" width="500" height="88" rx="20" fill="#ffffff" stroke="#e8dfea" stroke-width="2"/>
    <rect x="700" y="494" width="900" height="88" rx="20" fill="#ffffff" stroke="#eec445" stroke-width="2"/>
  </g>
  <circle cx="105" cy="538" r="20" fill="#eec445"/><text class="num" x="105" y="539" fill="#572e7e">4</text>
  <text class="phase" x="140" y="526">CONFIRMATION &amp; PAYMENT</text>
  <text class="copy" x="140" y="555">Email approval and manual bank-transfer check</text>
  <line class="arrow-line" x1="598" y1="538" x2="660" y2="538"/>
  <text class="row-title" x="730" y="528">Client approval journey</text>
  <text class="copy" x="730" y="557">Quotation acceptance, agreement and deposit-status sync</text>
  <rect x="1660" y="516" width="170" height="44" rx="22" fill="#f2eaf6"/><text class="status" x="1745" y="539" fill="#572e7e">DEMO</text>

  <!-- Row 5 -->
  <g filter="url(#shadow)">
    <rect x="70" y="594" width="500" height="88" rx="20" fill="#ffffff" stroke="#e8dfea" stroke-width="2"/>
    <rect x="700" y="594" width="900" height="88" rx="20" fill="#ffffff" stroke="#4898d1" stroke-width="2"/>
  </g>
  <circle cx="105" cy="638" r="20" fill="#4898d1"/><text class="num" x="105" y="639" fill="#ffffff">5</text>
  <text class="phase" x="140" y="626">BOOKING &amp; READINESS</text>
  <text class="copy" x="140" y="655">Staff handoff and documents in many channels</text>
  <line class="arrow-line" x1="598" y1="638" x2="660" y2="638"/>
  <text class="row-title" x="730" y="628">Central operations workspace</text>
  <text class="copy" x="730" y="657">Bus, driver, guide and food tasks, evidence and approvals</text>
  <rect x="1660" y="616" width="170" height="44" rx="22" fill="#fff4ce"/><text class="status" x="1745" y="639" fill="#765b0a">PARTIAL</text>

  <!-- Row 6 -->
  <g filter="url(#shadow)">
    <rect x="70" y="694" width="500" height="88" rx="20" fill="#ffffff" stroke="#e8dfea" stroke-width="2"/>
    <rect x="700" y="694" width="900" height="88" rx="20" fill="#ffffff" stroke="#4898d1" stroke-width="2"/>
  </g>
  <circle cx="105" cy="738" r="20" fill="#4898d1"/><text class="num" x="105" y="739" fill="#ffffff">6</text>
  <text class="phase" x="140" y="726">D-DAY EXECUTION</text>
  <text class="copy" x="140" y="755">Status updates through calls and group chats</text>
  <line class="arrow-line" x1="598" y1="738" x2="660" y2="738"/>
  <text class="row-title" x="730" y="728">Guide and Teacher PWA</text>
  <text class="copy" x="730" y="757">GPS, checkpoints, offline queue and photo evidence</text>
  <rect x="1660" y="716" width="170" height="44" rx="22" fill="#f2eaf6"/><text class="status" x="1745" y="739" fill="#572e7e">DEMO</text>

  <!-- Row 7 -->
  <g filter="url(#shadow)">
    <rect x="70" y="794" width="500" height="88" rx="20" fill="#ffffff" stroke="#e8dfea" stroke-width="2"/>
    <rect x="700" y="794" width="900" height="88" rx="20" fill="#ffffff" stroke="#4898d1" stroke-width="2"/>
  </g>
  <circle cx="105" cy="838" r="20" fill="#4898d1"/><text class="num" x="105" y="839" fill="#ffffff">7</text>
  <text class="phase" x="140" y="826">VISIBILITY &amp; CONTROL</text>
  <text class="copy" x="140" y="855">Admin and teacher depend on guide updates</text>
  <line class="arrow-line" x1="598" y1="838" x2="660" y2="838"/>
  <text class="row-title" x="730" y="828">Shared live monitoring</text>
  <text class="copy" x="730" y="857">Teacher view, Admin dashboard, verification and alerts</text>
  <rect x="1660" y="816" width="170" height="44" rx="22" fill="#f2eaf6"/><text class="status" x="1745" y="839" fill="#572e7e">DEMO</text>

  <!-- Row 8 -->
  <g filter="url(#shadow)">
    <rect x="70" y="894" width="500" height="88" rx="20" fill="#572e7e" stroke="#572e7e" stroke-width="2"/>
    <rect x="700" y="894" width="900" height="88" rx="20" fill="#f4eff7" stroke="#572e7e" stroke-width="2"/>
  </g>
  <circle cx="105" cy="938" r="20" fill="#eec445"/><text class="num" x="105" y="939" fill="#572e7e">8</text>
  <text x="140" y="926" style="font-family:Arial,sans-serif;font-size:15px;font-weight:800;letter-spacing:1px;fill:#eec445">POST-TOUR CLOSEOUT</text>
  <text x="140" y="955" style="font-family:Arial,sans-serif;font-size:17px;fill:#ffffff">Manual feedback, incidents and reporting</text>
  <line class="arrow-line" x1="598" y1="938" x2="660" y2="938"/>
  <text class="row-title" x="730" y="928">Structured teacher review</text>
  <text class="copy" x="730" y="957">Service verification and compliance record; analytics planned</text>
  <rect x="1660" y="916" width="170" height="44" rx="22" fill="#e8f6ee"/><text class="status" x="1745" y="939" fill="#187047">BASIC READY</text>

  <circle cx="80" cy="1031" r="8" fill="#ce307d"/>
  <text class="foot" x="98" y="1037">Frontend prototype ready</text>
  <circle cx="342" cy="1031" r="8" fill="#eec445"/>
  <text class="foot" x="360" y="1037">Backend / external integration pending</text>
  <text class="foot" x="1850" y="1037" text-anchor="end">One workflow · One source of truth · Fewer manual handoffs</text>
</svg>
